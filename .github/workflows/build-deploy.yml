name: Build & Deploy

on:
  push:
    branches: [development, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # development: deploy ke server dev (tag image "development")
  COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
  COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
  # master: opsional, deploy ke server production (tag image "production").
  # Kosongkan selama belum ada server prod -> step deploy prod otomatis di-skip.
  COOLIFY_DEPLOY_WEBHOOK_PROD: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_PROD }}
  COOLIFY_TOKEN_PROD: ${{ secrets.COOLIFY_TOKEN_PROD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set image tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "IMAGE_TAG=production" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=development" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Ganti ke linux/arm64 kalau server Coolify ARM.
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_APP_URL=${{ vars.VITE_APP_URL }}
            VITE_LANDING_URL=${{ vars.VITE_LANDING_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Coolify (development)
        if: github.ref_name == 'development' && env.COOLIFY_DEPLOY_WEBHOOK != ''
        run: |
          curl --fail-with-body -sS --request POST "$COOLIFY_DEPLOY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

      - name: Deploy to Coolify (production)
        if: github.ref_name == 'master' && env.COOLIFY_DEPLOY_WEBHOOK_PROD != ''
        run: |
          curl --fail-with-body -sS --request POST "$COOLIFY_DEPLOY_WEBHOOK_PROD" \
            --header "Authorization: Bearer $COOLIFY_TOKEN_PROD"
